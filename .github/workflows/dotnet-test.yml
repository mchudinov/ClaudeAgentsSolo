name: dotnet-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/ClaudeAgentsSolo.slnx

      - name: Build
        run: dotnet build src/ClaudeAgentsSolo.slnx --no-restore -c Release

      - name: Test
        run: dotnet test src/ClaudeAgentsSolo.slnx --no-build -c Release --filter "Category!=Integration" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
